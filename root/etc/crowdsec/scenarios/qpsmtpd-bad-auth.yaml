type: leaky
name: koozali/qpsmtpd-strict-auth
description: "High penalty threshold for bad authentication attempts via IMAP/SMTP"
filter: "evt.Meta.service == 'smtp' && evt.Meta.smtp_status == 'deny' && evt.Meta.qpsmtpd_plugin == 'auth::auth_imap'"
leakspeed: 30s
capacity: 2
groupby: "evt.Meta.source_ip"
blackhole: 1h
labels:
  remediation: ban
  duration: 5h  
